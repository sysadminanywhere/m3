services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-m3}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-m3}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-m3}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  docker-api:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      PING: 1
      VERSION: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  app:
    image: m3:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      docker-api:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    stop_grace_period: 120s
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-m3}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_LIQUIBASE_ENABLED: "true"
      SPRING_JPA_SHOW_SQL: "false"
      VAADIN_LAUNCH_BROWSER: "false"
      SPRING_PROFILES_ACTIVE: prod
      M3_DOCKER_API_URL: http://docker-api:2375
      M3_WORKER_IMAGE: m3:local
      M3_WORKER_NETWORK: ${COMPOSE_PROJECT_NAME:-m3}_default
      M3_BROKER_RABBIT_HOST: rabbitmq
      M3_BROKER_RABBIT_USERNAME: ${RABBITMQ_USER:-m3}
      M3_BROKER_RABBIT_PASSWORD: ${RABBITMQ_PASSWORD:-m3}
    ports:
      - "${M3_PORT:-8080}:8080"

volumes:
  postgres_data:
  rabbitmq_data:
