openapi: 3.0.3
info:
  title: M3 Community API
  version: 2.0.0
paths:
  /api/v2/health/live: {get: {responses: {'200': {description: Service process is alive}}}}
  /api/v2/health/ready: {get: {responses: {'200': {description: Database is reachable}, '503': {description: Not ready}}}}
  /api/v2/configuration/schema: {get: {responses: {'200': {description: Supported configuration format}}}}
  /api/v2/configuration/version: {get: {responses: {'200': {description: Current published version}}}}
  /api/v2/jobs: {get: {responses: {'200': {description: Recent jobs and delivery state; each item includes executionGroup}}}}
  /api/v2/jobs/search:
    get:
      parameters:
        - {name: status, in: query, schema: {type: string}}
        - {name: group, in: query, schema: {type: string}}
        - {name: source, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses: {'200': {description: Filtered page of jobs}, '400': {description: Invalid pagination}}
  /api/v2/messages: {get: {responses: {'200': {description: Recent immutable original messages}}}}
  /api/v2/metrics/summary: {get: {responses: {'200': {description: Local operational summary}}}}
  /api/v2/topology: {get: {responses: {'200': {description: Source and execution group identifiers from the published configuration}}}}
  /api/v2/messages/{id}/integrity:
    get:
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Original checksum verification}, '503': {description: Original content unavailable}}
  /api/v2/messages/{id}/original:
    get:
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Immutable original bytes, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '404': {description: Message not found}
        '503': {description: Original content unavailable}
  /api/v2/messages/{id}/reprocess:
    post:
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'202': {description: New jobs queued using the current published configuration; a duplicate is possible}, '404': {description: Message not found}, '409': {description: No current configuration, source, or matching rule}}
  /api/v2/messages/{id}/retention:
    put:
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                retainUntil: {type: string, format: date-time, nullable: true}
      responses: {'204': {description: Retention updated}, '404': {description: Message not found}}
  /api/v2/messages/{id}:
    delete:
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'202': {description: Metadata removed and content scheduled for delayed cleanup}, '404': {description: Message not found}, '409': {description: Retention or active jobs prevent deletion}}
  /api/v2/jobs/{id}/retry:
    post:
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'202': {description: Delivery retry queued; a duplicate is possible}, '409': {description: Job is currently leased}}
  /api/v2/secrets/{id}:
    put:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SecretRequest'}}}}
      responses: {'204': {description: Secret stored; its value is never returned}, '400': {description: Empty identifier or value}}
    get:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Safe secret metadata only}}
  /api/v2/configuration/validate:
    post:
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Configuration'}}}}
      responses: {'200': {description: Validation result}}
  /api/v2/configuration/publish:
    post:
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PublishRequest'}}}}
      responses: {'200': {description: Published}, '400': {description: Invalid}, '409': {description: Version conflict}}
  /api/v2/jobs/{id}/history:
    get:
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Recorded job state transitions and attempts}}
components:
  schemas:
    Configuration:
      type: object
      required: [formatVersion]
      properties:
        formatVersion: {type: string, enum: ['2']}
        connections: {type: array, items: {type: object}}
        sources: {type: array, items: {type: object}}
        recipients: {type: array, items: {type: object}}
        rules: {type: array, items: {$ref: '#/components/schemas/Rule'}}
        delete:
          type: object
          description: Explicit identifiers to remove; references are validated against the resulting configuration.
          properties:
            connections: {type: array, items: {type: string}}
            sources: {type: array, items: {type: string}}
            recipients: {type: array, items: {type: string}}
            rules: {type: array, items: {type: string}}
    Rule:
      type: object
      required: [id, sourceIds, recipientId]
      properties:
        id: {type: string}
        sourceIds: {type: array, items: {type: string}}
        recipientId: {type: string}
        executionGroup: {type: string, default: default}
        processingMode: {type: string, enum: [PARALLEL, SEQUENTIAL], default: PARALLEL}
        onError: {type: string, enum: [STOP, CONTINUE], default: STOP}
        enabled: {type: boolean, default: true}
        condition:
          type: object
          properties:
            fileNameEquals: {type: string}
    PublishRequest:
      type: object
      required: [document, expectedVersion]
      properties:
        document: {$ref: '#/components/schemas/Configuration'}
        expectedVersion: {type: integer, minimum: 0}
    SecretRequest:
      type: object
      required: [value]
      properties:
        value: {type: string, writeOnly: true}
