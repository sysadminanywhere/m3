server.port=${PORT:8080}
logging.level.org.atmosphere=warn

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true
vaadin.devmode.devTools.enabled=false

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,com.sysadminanywhere

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/m3}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Liquibase owns schema changes; Hibernate checks mappings after migrations finish.
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Optional control-plane settings for the Docker Engine proxy and managed rule workers.
m3.docker.api-url=${M3_DOCKER_API_URL:}
m3.worker.image=${M3_WORKER_IMAGE:m3:local}
m3.worker.network=${M3_WORKER_NETWORK:}
m3.worker.files-volume=${M3_WORKER_FILES_VOLUME:}
m3.outbound.max-attempts=${M3_OUTBOUND_MAX_ATTEMPTS:20}
m3.worker.reconcile-delay-ms=${M3_WORKER_RECONCILE_DELAY_MS:30000}

# Durable receipt notifications for external consumers.
m3.broker.rabbit.host=${M3_BROKER_RABBIT_HOST:localhost}
m3.broker.rabbit.port=${M3_BROKER_RABBIT_PORT:5672}
m3.broker.rabbit.username=${M3_BROKER_RABBIT_USERNAME:m3}
m3.broker.rabbit.password=${M3_BROKER_RABBIT_PASSWORD:m3}
m3.broker.rabbit.virtual-host=${M3_BROKER_RABBIT_VIRTUAL_HOST:/}
m3.broker.rabbit.exchange=${M3_BROKER_RABBIT_EXCHANGE:m3.events}
m3.broker.rabbit.queue=${M3_BROKER_RABBIT_QUEUE:m3.message.received}
m3.receipts.poll-delay-ms=${M3_RECEIPTS_POLL_DELAY_MS:1000}

# Keep heartbeat, receiver reconciliation, delivery and outbox publication independent.
spring.task.scheduling.pool.size=6

# Batch secondary entity/collection reads used by paged UI lists.
spring.jpa.properties.hibernate.default_batch_fetch_size=64
