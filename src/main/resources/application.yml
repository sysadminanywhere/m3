server:
  port: ${SERVER_PORT:8080}
spring:
  application.name: m3-community
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/m3}
    username: ${DB_USER:m3}
    password: ${DB_PASSWORD:m3}
  flyway:
    schemas: community
    default-schema: community
    create-schemas: true
  main:
    lazy-initialization: true
management.endpoints.web.exposure.include: health,info
